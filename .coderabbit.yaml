# CodeRabbit configuration — schema: https://docs.coderabbit.ai/reference/yaml-template
language: "en-US"

tone_instructions: >-
  Windows tray app. Manual COM vtable dispatch in NativeMethods.cs is intentional
  (no generated interop). Focus on COM lifetime, hotkey reliability, and self-update
  flow correctness — not generic "unsafe interop" alarms.

reviews:
  profile: "chill"
  poem: false
  collapse_walkthrough: true
  changed_files_summary: true
  high_level_summary: true
  sequence_diagrams: false
  assess_linked_issues: true
  related_issues: true

  path_filters:
    - "!bin/**"
    - "!obj/**"
    - "!publish/**"
    - "!**/*.user"
    - "!**/*.suo"
    - "!**/*.pdb"
    - "!**/*.ico"
    - "!**/*.exe"
    - "!screenshots/**"
    - "!AUDIT_TASKS.md"
    - "!AUDIT_PLAN.md"
    - "!MASTER_BUGLIST.md"
    - "!TODO_LIST.md"
    - "!SCHEDULED_TASKS.md"

  path_instructions:
    - path: "NativeMethods.cs"
      instructions: |
        Manual COM vtable dispatch through CoCreateInstance + Marshal.GetDelegateForFunctionPointer
        + Marshal.ReadIntPtr is the INTENTIONAL design — no auto-generated interop, no CsWin32.
        Every CoCreateInstance and out-pointer has a matching Marshal.Release in try/finally,
        and PROPVARIANT is cleared via PropVariantClear + FreeCoTaskMem.

        Do NOT flag the EXISTING vtable-dispatch / Marshal.ReadIntPtr / PROPVARIANT pattern as
        "unsafe", "should use CsWin32", "should use generated interop", or "consider
        Windows.Devices.Enumeration". It is by design.

        DO flag: NEW unsafe patterns introduced by a PR that go beyond the existing surface
        (raw stackalloc'd buffers passed to native code, fixed-statement scope leaks, new
        CoCreateInstance calls that don't follow the established Release-in-finally pattern);
        missing Release calls on early-return paths, exception paths that bypass cleanup,
        incorrect vtable slot indices, IID/CLSID typos, PROPVARIANT not cleared before reuse,
        and any thread-safety issue (audio device-change events arrive on a non-UI thread —
        UI mutations must marshal via Invoke/BeginInvoke).
    - path: "AudioManager.cs"
      instructions: |
        COM lifetime owner. Pair every Get* with the matching Release. IMMNotificationClient
        callbacks arrive on a non-UI thread — flag any UI mutation that is not marshalled
        to the UI thread. Degraded mode (no mic on startup) re-attempts Initialize via
        OnSyncTick — do not break the re-init path.
    - path: "Config.cs"
      instructions: |
        INI persistence via WritePrivateProfileString / GetPrivateProfileString P/Invoke
        (DllImport on kernel32). The buffer-size argument to GetPrivateProfileString must
        accommodate the longest expected value or silent truncation occurs — flag any
        change that hardcodes a smaller buffer than current callers use. Config.FixEncoding
        handles UTF-16 LE → ANSI on first load (the ANSI INI API would otherwise mangle).
        Path sanitization happens here; flag any user-controlled path that bypasses it.
    - path: "ShortcutHelper.cs"
      instructions: |
        Startup-folder .lnk creation via WScript.Shell COM (Type.GetTypeFromProgID +
        Activator.CreateInstance). COM objects must be released via Marshal.FinalReleaseComObject
        in try/finally — flag any path that returns without releasing the WScript.Shell or
        IWshShortcut instance, including exception paths.
    - path: "UpdateDialog.cs"
      instructions: |
        Self-update with a per-hop allowlisted host set: github.com/itsnateai/MicMute/,
        api.github.com/repos/itsnateai/MicMute/, objects.githubusercontent.com,
        release-assets.githubusercontent.com. Every URL must pass IsAllowedReleaseOrigin
        on every redirect hop. Flag any change that adds NEW hosts to the allowlist,
        skips SHA256 verification, or relaxes the .new/.old/.ok rename dance.
        (Narrowing the allowlist or removing hosts is fine — don't flag those.)
    - path: "TrayApp.cs"
      instructions: |
        Owns hotkey registration, PTT polling timer, sync timer (15 s), OSD plumbing,
        and TaskbarCreated message handling for explorer-restart recovery. Single-instance
        guarded by named mutex Global\\MicMute_SingleInstance in Program.cs.
    - path: "MicMute.Tests/**"
      instructions: |
        xUnit test project. Tests must be deterministic and must NOT require a real
        audio endpoint at runtime.
    - path: "**/*.cs"
      instructions: |
        C# 12 / .NET 8 / WinForms. Tray app — WinForms is the chosen UI stack, do NOT
        flag its use or suggest WPF/WinUI/MAUI. Prefer file-scoped namespaces, modern
        pattern matching, and nullable reference types (already enabled).

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 3
    ignore_title_keywords:
      - "chore: release"
      - "release v"
      - "bump version"
      - "changelog"
      - "release notes"
      - "cut v"
    ignore_usernames:
      - "dependabot[bot]"
      - "release-please[bot]"
      - "github-actions[bot]"
    base_branches:
      - ".*"

  tools:
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    semgrep:
      enabled: true

chat:
  auto_reply: true
